<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Obsidian Vault — Midnight Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Obsidian Vault: a stealth heist game. Move the thief with WASD or arrow keys, sneak with Shift, drop a smoke bomb with Space, and steal the Obsidian Star"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
